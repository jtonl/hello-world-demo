<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      background: #f7f7f5;
      color: #1a1a1a;
    }

    main {
      max-width: 34rem;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      color: #4a4a4a;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #161614;
        color: #ececec;
      }

      p {
        color: #b3b3b3;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>
      A single page with nothing to sell and nothing to sign up for &mdash; just a heading,
      a paragraph, and a little embedded CSS to keep them company.
    </p>
  </main>
</body>
</html>
